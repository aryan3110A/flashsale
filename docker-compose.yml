# FlashSale - full stack:  docker compose up --build -d
name: flashsale-sd

x-node-service: &node-service
  restart: unless-stopped
  init: true
  networks: [backend]
  environment: &common-env
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flashsale}
      POSTGRES_USER: ${POSTGRES_USER:-flashsale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence; noeviction is required by BullMQ (it must never lose queue keys to eviction).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-service:
    <<: *node-service
    build: { context: ., dockerfile: apps/mock-service/Dockerfile }
    environment:
      <<: *common-env
      PORT: 8082
      ENABLE_CHAOS: ${ENABLE_CHAOS:-true}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s

  booking-api:
    <<: *node-service
    build: { context: ., dockerfile: apps/booking-api/Dockerfile }
    environment:
      <<: *common-env
      PORT: 8081
      DATABASE_URL: postgres://${POSTGRES_USER:-flashsale}:${POSTGRES_PASSWORD:-change_me_local}@postgres:5432/${POSTGRES_DB:-flashsale}
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      JOB_ATTEMPTS: ${JOB_ATTEMPTS:-4}
      JOB_BACKOFF_MS: ${JOB_BACKOFF_MS:-1000}
      ENABLE_CHAOS: ${ENABLE_CHAOS:-true}
      ENABLE_DEMO_ENDPOINTS: ${ENABLE_DEMO_ENDPOINTS:-true}
      ENABLE_TEST_ENDPOINTS: ${ENABLE_TEST_ENDPOINTS:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 20s

  worker:
    <<: *node-service
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    stop_grace_period: 30s
    environment:
      <<: *common-env
      PORT: 9100
      DATABASE_URL: postgres://${POSTGRES_USER:-flashsale}:${POSTGRES_PASSWORD:-change_me_local}@postgres:5432/${POSTGRES_DB:-flashsale}
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_PROCESSING_MIN_MS: ${WORKER_PROCESSING_MIN_MS:-400}
      WORKER_PROCESSING_MAX_MS: ${WORKER_PROCESSING_MAX_MS:-1200}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      booking-api: { condition: service_healthy }   # booking-api owns migrations
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9100/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 10s

  gateway:
    <<: *node-service
    build: { context: ., dockerfile: apps/gateway/Dockerfile }
    networks: [edge, backend]
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *common-env
      PORT: 8080
      REDIS_URL: redis://redis:6379
      API_URL: http://booking-api:8081
      MOCK_URL: http://mock-service:8082
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-40}
      RATE_LIMIT_REFILL_RATE: ${RATE_LIMIT_REFILL_RATE:-20}
      RATE_LIMIT_REFILL_INTERVAL: ${RATE_LIMIT_REFILL_INTERVAL:-1000}
      RATE_LIMIT_HEALTH_CAPACITY: ${RATE_LIMIT_HEALTH_CAPACITY:-300}
      RATE_LIMIT_HEALTH_REFILL_RATE: ${RATE_LIMIT_HEALTH_REFILL_RATE:-150}
      RATE_LIMIT_HEALTH_REFILL_INTERVAL: ${RATE_LIMIT_HEALTH_REFILL_INTERVAL:-1000}
      RATE_LIMIT_TRUST_CLIENT_ID: ${RATE_LIMIT_TRUST_CLIENT_ID:-false}
      CIRCUIT_FAILURE_THRESHOLD: ${CIRCUIT_FAILURE_THRESHOLD:-3}
      CIRCUIT_RESET_TIMEOUT_MS: ${CIRCUIT_RESET_TIMEOUT_MS:-10000}
      CIRCUIT_HALF_OPEN_MAX_CALLS: ${CIRCUIT_HALF_OPEN_MAX_CALLS:-1}
      CIRCUIT_SUCCESS_THRESHOLD: ${CIRCUIT_SUCCESS_THRESHOLD:-2}
      MOCK_TIMEOUT_MS: ${MOCK_TIMEOUT_MS:-2500}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-2}
    depends_on:
      redis: { condition: service_healthy }
      booking-api: { condition: service_healthy }
      mock-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8080}
    restart: unless-stopped
    init: true
    networks: [edge]
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./load-tests/results:/app/load-results:ro   # lets the playground show the latest real k6 results
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  # `internal: true` = no route to or from the outside world; only containers on this network can reach each other.
  backend:
    internal: true
  edge: {}

volumes:
  pgdata:
  redisdata:
